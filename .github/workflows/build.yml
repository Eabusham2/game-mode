name: Build GameMode.exe

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Allow the release job to create/update releases (rolling "latest" + tags).
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, reproducible cross-build with MinGW-w64 on Linux. This is the
  # authoritative artifact (matches the project's verified build path).
  mingw:
    name: Cross-build (MinGW / Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 make file

      - name: Build
        run: make CC=x86_64-w64-mingw32-gcc WINDRES=x86_64-w64-mingw32-windres

      - name: Verify it is a 64-bit Windows GUI exe
        run: |
          file GameMode.exe
          file GameMode.exe | grep -q "PE32+ executable (GUI) x86-64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameMode-windows-x64
          path: GameMode.exe
          if-no-files-found: error

  # Native build using the MSVC toolchain via build.bat, to validate that path.
  msvc:
    name: Native build (MSVC / Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameMode-msvc-x64
          path: GameMode.exe
          if-no-files-found: error

  # Publish the built exe as a downloadable GitHub Release asset so anyone can
  # grab a ready-to-run GameMode.exe without logging in, unzipping a CI artifact
  # or building it themselves. Runs in two situations (never on PRs):
  #   * push to main  -> updates a rolling "latest" pre-release (always current)
  #   * push of a v*   -> creates a pinned, versioned release with release notes
  release:
    name: Publish GameMode.exe
    needs: [mingw, msvc]
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Download MSVC build
        uses: actions/download-artifact@v4
        with:
          name: GameMode-msvc-x64

      # Rolling build: every push to main (re)publishes GameMode.exe on the
      # "latest" tag. Stable, login-free download link:
      #   https://github.com/<owner>/<repo>/releases/download/latest/GameMode.exe
      - name: Publish rolling "latest" build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (rolling)
          prerelease: true
          files: GameMode.exe
          body: |
            Automatically built from the latest commit on `main` (`${{ github.sha }}`).

            **Download:** [`GameMode.exe`](https://github.com/${{ github.repository }}/releases/download/latest/GameMode.exe)

            This rolling build updates on every push to `main`. For a pinned,
            versioned download instead, use a tagged release below.

      # Pinned release for a version tag (e.g. v3.0.0).
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GameMode.exe
          generate_release_notes: true
